name: CI/CD

# Esta entrada pertence ao repositório. Triggers, permissões, flags de release
# e jobs específicos são editados aqui. As implementações compartilhadas são
# chamadas por SHA; o Renovate propõe atualizações com revisão e CI.
# `.precisa.json` fornece os valores iniciais durante a criação do repositório.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number for a manual review re-run'
        required: false
        type: number

permissions:
  # `contents: write` porque _release.yml (reusable) precisa criar
  # commits e tags via semantic-release. Workflows reusáveis só
  # conseguem pedir permissões que o caller também concede.
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  # `models: read` pelo mesmo motivo: review.yml chama GitHub Models
  # via GITHUB_TOKEN no fallback de providers.
  models: read

# Cancela só em PR. O `push` deste workflow só dispara na branch padrão, e lá
# o run publica no npm: cancelar no meio deixa a tag criada sem a versão
# publicada. Foi o que aconteceu no fhir-brasil, onde cinco tags (v0.16.6 a
# v0.17.3) ficaram sem publicar porque cada merge cancelava o publish do merge
# anterior — e o commit `chore(release)` do semantic-release dispara mais um
# run, que cancela o próprio publish que o criou.
#
# Chavear por `event_name` em vez de comparar a branch evita depender de
# `github.event.repository.default_branch`, que nem todo contexto de gatilho
# popula — e, se viesse vazio, a comparação daria `true` e voltaria a cancelar
# na branch padrão, justamente o que este comentário existe para impedir.
# Assim, qualquer evento inesperado cai no lado seguro (não cancela).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── CI checks (every PR and push) ──────────────────────────────
  checks:
    uses: Precisa-Saude/tooling/.github/workflows/_checks.yml@7a61cab18cac4aa7e2163f92dab77209109480de # v2.0.0
    secrets: inherit

  # ── Automated code review (PR, or manual dispatch, after checks) ─
  review:
    needs: checks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number > 0)
    uses: ./.github/workflows/review.yml
    with:
      # fromJSON porque em workflow_dispatch o inputs.pr_number chega como
      # string (mesmo declarado `type: number` no input) e reprova o
      # type-check do input `number` do review.yml — o run conclui "failure"
      # na inicialização, sem criar job nenhum. Verificado no platform
      # (runs 32487421501/32488144271).
      pr_number: ${{ fromJSON(github.event.pull_request.number || inputs.pr_number || 0) }}
    secrets: inherit

  # ── Release (main only, guarded on package changes) ────────────
  release:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: Precisa-Saude/tooling/.github/workflows/_release.yml@7a61cab18cac4aa7e2163f92dab77209109480de # v2.0.0
    secrets: inherit

  # ── Publish to npm (when release created a new version) ────────
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: Precisa-Saude/tooling/.github/workflows/_publish.yml@7a61cab18cac4aa7e2163f92dab77209109480de # v2.0.0
    with:
      release_sha: ${{ needs.release.outputs.release_sha }}
      # Newline-separated list of package directories. One per line.
      packages: |
        packages/dataset
        packages/eval-harness
    secrets: inherit

  # ── Deploy site (Cloudflare Pages + Slack notify) ──────────────
  # Dispatch com pr_number é um re-run de review, não um pedido de deploy —
  # por isso o guard extra: sem ele, re-rodar o review de um PR redeployava
  # o site junto.
  deploy-site:
    needs: checks
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.pr_number)
    uses: ./.github/workflows/_deploy-site.yml
    with:
      project_name: 'medbench-brasil'
      site_filter: '@medbench-brasil/site'
      site_source_path: 'site/,results/'
    secrets: inherit
