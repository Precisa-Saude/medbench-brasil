name: Publish tag to npm

# Recuperação manual: publica os pacotes de uma tag git específica no npm.
# Usado quando semantic-release criou a tag + commit chore(release) mas o
# step de publish foi interrompido (cancel de concorrência, npm fora do ar,
# rotação de token mid-release, etc.). Idempotente — só publica se a versão
# não estiver no registry.
#
# Uso: gh workflow run publish-tag.yml -f tag=v1.1.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Git para publicar (ex.: v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Validar release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolver tag publicada na branch padrão
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error('Informe uma tag de versão válida.');
            }
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            if (release.draft || release.tag_name !== tag) throw new Error('Release não publicada.');
            const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
            let object = ref.object;
            for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
              const { data: annotated } = await github.rest.git.getTag({ ...repo, tag_sha: object.sha });
              object = annotated.object;
            }
            if (object.type !== 'commit' || !/^[a-f0-9]{40}$/.test(object.sha)) {
              throw new Error('A tag não aponta para um commit válido.');
            }
            const { data: comparison } = await github.rest.repos.compareCommits({
              ...repo, base: context.payload.repository.default_branch, head: object.sha,
            });
            if (!['identical', 'behind'].includes(comparison.status)) {
              throw new Error('O commit da release não pertence à branch padrão.');
            }
            core.setOutput('sha', object.sha);
            core.info(`Release validada: ${tag} (${object.sha})`);

  publish:
    needs: resolve
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    name: Publish tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      - name: Publish packages (idempotent)
        # Auto-discovers publishable packages via pnpm's workspace filter
        # (`./packages/**`, skipping those with `private: true`). No
        # per-repo list to keep in sync; adding a new package means
        # adding it to `packages/` and the next tag picks it up.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          # Sem `--if-present`: essa flag existe em `pnpm run`, não em
          # `pnpm exec`, e fazia o comando abortar com "Unknown option"
          # antes de publicar qualquer pacote.
          pnpm -r --filter "./packages/**" exec sh -c '
            pkg_name=$(node -p "require(\"./package.json\").name")
            pkg_version=$(node -p "require(\"./package.json\").version")
            pkg_private=$(node -p "Boolean(require(\"./package.json\").private)")
            if [ "$pkg_private" = "true" ]; then
              echo "Skipping $pkg_name (private)"
              exit 0
            fi
            if npm view "$pkg_name@$pkg_version" version 2>/dev/null; then
              echo "Skipping $pkg_name@$pkg_version (already published)"
            else
              echo "Publishing $pkg_name@$pkg_version..."
              pnpm publish --provenance --access public --no-git-checks
            fi
          '
